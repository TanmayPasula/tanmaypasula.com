    <!-- Ink, the app's text colour (matches theme_color in the web app manifest). -->
    <meta name="theme-color" content="#1D2733" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="ClearNotice — government letters, made clear. Take a photo of a letter from Medi-Cal, CalFresh, the IRS, Social Security or immigration and see what it is, what to do, and by when. In English, Spanish, Vietnamese and Chinese."
    />
    <title>ClearNotice — government letters, made clear</title>
    <!-- Paper (light) or dark background before the stylesheet loads, so there is no white flash. -->
    <style>html{color:#16241d;background:#f6f6f0}html.dark{color:#eef1ea;background:#111915}</style>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('cn-theme');
        // Light (sage green) is the default; Dark only when the person picks it in Settings.
        if (t === 'dark') document.documentElement.classList.add('dark');
        localStorage.removeItem('cn-palette'); // palettes were removed; forget an old choice
        if (localStorage.getItem('cn-large-text') === '1') document.documentElement.classList.add('large-text');
      } catch (e) {}
    </script>
